# Blueprint Render: database + backend + frontend.
# Su Render: New > Blueprint > repository > Apply.
# I nomi dei servizi sono gia' quelli del progetto.

databases:
  - name: day4-week8-db
    databaseName: day4_week8
    user: day4_week8
    plan: free
    region: frankfurt

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: day4-week8-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: day4-week8-db
          property: connectionString
      # Origine del FE per il CORS, es. https://day4-week8-fe.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false
      # Chiave di firma dei token, la stessa a ogni deploy: si incolla a mano
      # (openssl rand -base64 48). generateValue darebbe 32 caratteri, troppo
      # corti una volta decodificati da base64 per una firma HMAC-SHA256.
      - key: JWT
        sync: false

  # ---------- Frontend: build Vite statica ----------
  - type: web
    name: day4-week8-fe
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      # Indirizzo del BE, es. https://day4-week8-be.onrender.com (senza / finale)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
