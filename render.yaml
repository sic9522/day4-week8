# Blueprint Render: database + backend + frontend.
# Su Render: New > Blueprint > repository > Apply.

databases:
  - name: iltempiodeilibri-db
    databaseName: iltempiodeilibri
    user: iltempiodeilibri
    plan: free
    region: frankfurt

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: iltempiodeilibri-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iltempiodeilibri-db
          property: connectionString

      # Origine del FE per il CORS, es. https://iltempiodeilibri-fe.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false

      # Chiave di firma dei token, la stessa a ogni deploy: si incolla a mano
      # (openssl rand -base64 48). generateValue darebbe 32 caratteri, troppo
      # corti una volta decodificati da base64 per una firma HMAC-SHA256.
      - key: JWT_SECRET
        sync: false

      # Utenza master: l'unica che puo' nominare admin
      - key: MASTER_USERNAME
        sync: false
      - key: MASTER_PASSWORD
        sync: false

      # Dati dimostrativi: 10 sedi, 10 admin, 100 clienti con password note.
      # Metterlo a "false" prima di aprire il sito a qualcuno che non sia te.
      - key: DEMO_ENABLED
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENTE_PASSWORD
        sync: false

  # ---------- Frontend: build Vite statica ----------
  - type: web
    name: iltempiodeilibri-fe
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      # Indirizzo del BE, es. https://iltempiodeilibri-be.onrender.com (senza / finale)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
